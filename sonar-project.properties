# Configuración de SonarCloud para Stem-Hub-BackEnd
# Reemplazar sonar.organization y sonar.projectKey por los valores reales
# que SonarCloud asigna al crear el proyecto (https://sonarcloud.io).

sonar.organization=stemhub-dev
sonar.projectKey=Stemhub-Dev_Stem-Hub-BackEnd

sonar.projectName=Stem-Hub-BackEnd
sonar.sources=.
sonar.exclusions=**/*_test.go,**/mocks/**,**/docs/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Reporte de cobertura generado por `go test -coverprofile=coverage.out`
sonar.go.coverage.reportPaths=coverage.out

name: stemhub-proyecto

services:

  postgres:
    image: postgres:17
    container_name: stemhub-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - stemhub_postgres_dev_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: stemhub-backend
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_PORT: 8080

    ports:
      - "${APP_PORT:-8080}:8080"

    depends_on:
      postgres:
        condition: service_healthy


volumes:

  stemhub_postgres_dev_data:
    name: stemhub_postgres_dev_data